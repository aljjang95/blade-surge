apply plugin: 'com.android.application'

def signingPath = System.getenv('BLADESURGE_KEYSTORE')
def signingPassword = System.getenv('BLADESURGE_KEYSTORE_PASSWORD')
// 원격 서명 서비스(apex sign/play)가 업로드 키로 직접 서명하므로, 명시적으로 켠 경우에만 서명 없는 릴리스를 허용한다.
// 디버그 키로 대체하지 않으며 signingConfig 자체를 붙이지 않는다.
def unsignedForSigner = System.getenv('BLADESURGE_UNSIGNED_FOR_SIGNER') == '1'
def versionCodeValue = (System.getenv('BLADESURGE_VERSION_CODE') ?: '1')
if (!versionCodeValue.matches('[1-9][0-9]{0,8}')) throw new GradleException('BLADESURGE_VERSION_CODE는 양의 정수여야 합니다.')
def versionNameValue = (System.getenv('BLADESURGE_VERSION_NAME') ?: '1.0')
def providers = new groovy.json.JsonSlurper().parse(rootProject.file('../config/store-providers.json'))
def adProvider = { channel ->
    def prefix = 'BLADESURGE_' + channel.toUpperCase()
    [app: System.getenv(prefix + '_ADMOB_APP_ID') ?: providers[channel].adMobAppId,
     unit: System.getenv(prefix + '_ADMOB_INTERSTITIAL_ID') ?: providers[channel].interstitialId]
}

android {
    namespace = "com.theluxurylord.bladesurge"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    flavorDimensions 'store'
    productFlavors {
        googleplay {
            dimension 'store'
            buildConfigField 'String', 'STORE_CHANNEL', '"googleplay"'
            buildConfigField 'String', 'STORE_AD_UNIT_ID', '"' + adProvider('googleplay').unit + '"'
            manifestPlaceholders = [adMobAppId: adProvider('googleplay').app]
        }
        onestore {
            dimension 'store'
            buildConfigField 'String', 'STORE_CHANNEL', '"onestore"'
            buildConfigField 'String', 'STORE_AD_UNIT_ID', '"' + adProvider('onestore').unit + '"'
            manifestPlaceholders = [adMobAppId: adProvider('onestore').app]
        }
    }
    defaultConfig {
        applicationId "com.theluxurylord.bladesurge"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeValue.toInteger()
        versionName versionNameValue
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingPath && signingPassword) {
                storeFile file(signingPath)
                storePassword signingPassword
                keyAlias 'bladesurge-release'
                keyPassword signingPassword
            }
        }
    }
    buildTypes {
        debug {
            // QA는 공식 샘플 광고만 사용하며 운영 광고 요청/클릭으로 검증하지 않는다.
            manifestPlaceholders = [adMobAppId: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'STORE_AD_UNIT_ID', '"ca-app-pub-3940256099942544/1033173712"'
        }
        release {
            if (!unsignedForSigner && signingPath && signingPassword) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// A release must use the app's own persistent key, never the debug certificate.
tasks.matching { it.name == 'preReleaseBuild' || it.name.matches('pre.+ReleaseBuild') }.configureEach {
    doFirst {
        if (!unsignedForSigner && (!signingPath || !signingPassword || !file(signingPath).isFile())) {
            throw new GradleException('Provide BLADESURGE_KEYSTORE and BLADESURGE_KEYSTORE_PASSWORD for a signed release (or BLADESURGE_UNSIGNED_FOR_SIGNER=1 for a remote-signer build).')
        }
        def channel = name.toLowerCase().contains('googleplay') ? 'googleplay' : name.toLowerCase().contains('onestore') ? 'onestore' : null
        if (!channel) throw new GradleException('스토어 채널이 지정된 릴리스가 필요합니다.')
        def approved = adProvider(channel)
        if (!approved.app || !approved.unit || !approved.app.matches('ca-app-pub-[0-9]{16}~[0-9]{10}') || !approved.unit.matches('ca-app-pub-[0-9]{16}/[0-9]{10}') || approved.app.startsWith('ca-app-pub-3940256099942544') || approved.unit.startsWith('ca-app-pub-3940256099942544')) {
            throw new GradleException('실제 제품의 AdMob 앱/광고 ID를 확인해야 운영 릴리스를 만들 수 있습니다.')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    googleplayImplementation 'com.android.billingclient:billing:9.1.0'
    onestoreImplementation 'com.onestorecorp.sdk:sdk-iap:21.04.00'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
